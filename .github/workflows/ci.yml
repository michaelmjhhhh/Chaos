name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Redis for Lua integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Format
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            gofmt -d cmd internal
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Production build without cgo
        env:
          CGO_ENABLED: '0'
        run: go build -tags mygo_noinspector ./...
      - name: Package and verify macOS app
        if: runner.os == 'macOS'
        run: ./build-app.sh

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin, linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile production binaries
        env:
          GOOS: ${{ matrix.target }}
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -tags mygo_noinspector ./...
