name: Release

# Build the drag-to-install DMG and attach it to the GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed. The Download buttons in the README and on the
# landing page point at /releases/latest/download/Chaos.dmg, so each tagged release
# automatically becomes "the latest download".
#
# Note: the app is ad-hoc signed, not notarized (no paid Apple Developer account), so
# first-time users still approve it once via System Settings → Privacy & Security.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach the DMG to"
        required: true

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate Go application
        run: go test ./... && go vet ./...

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('mygo.json') as f:
              version = json.load(f)['version']
          expected = 'v' + version
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f"Release tag must match mygo.json version: {expected}")
          PY

      - name: Build DMG
        run: ./package-dmg.sh

      - name: Attach DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: .build/Chaos.dmg
          fail_on_unmatched_files: true
